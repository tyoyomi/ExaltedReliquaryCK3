 er_reliquary_trinket_modifier_desc:0 "Legendary Reliquary court jewel bonuses."
 er_reliquary_helmet_modifier:0 "Exalted Reliquary Circlet"
 er_reliquary_helmet_modifier_desc:0 "Legendary Reliquary circlet bonuses."
 er_reliquary_pedestal_modifier:0 "Exalted Reliquary Relic"
 er_reliquary_pedestal_modifier_desc:0 "Legendary Reliquary display bonuses."
 er_upgrade_tier_1_modifier:0 "Reliquary Refinement I"
 er_upgrade_tier_1_modifier_desc:0 "First upgrade refinement on an Exalted Reliquary piece."
 er_upgrade_tier_2_modifier:0 "Reliquary Refinement II"
 er_upgrade_tier_2_modifier_desc:0 "Second upgrade refinement on an Exalted Reliquary piece."
 er_upgrade_tier_3_modifier:0 "Reliquary Refinement III"
 er_upgrade_tier_3_modifier_desc:0 "Third upgrade refinement on an Exalted Reliquary piece."
 er_awakened_combat_modifier:0 "Awakened Reliquary — Arms"
 er_awakened_combat_modifier_desc:0 "Mythic combat awakening. Strong court gear — not a demigod."
 er_awakened_court_modifier:0 "Awakened Reliquary — Court"
 er_awakened_court_modifier_desc:0 "Mythic court awakening for pomp and presence."
 er_awakened_learning_modifier:0 "Awakened Reliquary — Lore"
 er_awakened_learning_modifier_desc:0 "Mythic lore awakening for Learning and lifestyle."
 er_vault_grandeur_modifier:0 "Exalted Vault Grandeur"
 er_vault_grandeur_modifier_desc:0 "The Reliquary vault is staged for court grandeur and prestige pomp."
 er_regalia_duke_modifier:0 "Supreme Regalia — Ducal"
 er_regalia_duke_modifier_desc:0 "Ducal band of the Supreme Regalia."
 er_regalia_king_modifier:0 "Supreme Regalia — Royal"
 er_regalia_king_modifier_desc:0 "Royal band of the Supreme Regalia."
 er_regalia_emperor_modifier:0 "Supreme Regalia — Imperial"
 er_regalia_emperor_modifier_desc:0 "Imperial band of the Supreme Regalia."
 er_regalia_hegemony_modifier:0 "Supreme Regalia — Hegemonic"
 er_regalia_hegemony_modifier_desc:0 "Hegemonic band of the Supreme Regalia."
 er_heirloom_base_modifier:0 "Dynasty Heirloom"
 er_heirloom_base_modifier_desc:0 "House-bound heirloom prestige and regard."

 # Tooltips
 er_tt_under_awakened_cap:0 "You are under your awakened Reliquary cap"
 er_tt_under_heirloom_cap:0 "Your house is under its heirloom cap"
