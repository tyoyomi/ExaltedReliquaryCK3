l_english:
 # Decision
 er_manage_reliquary_decision:0 "Manage Reliquary"
 er_manage_reliquary_decision_desc:0 "Open the Exalted Reliquary hub to review economy mode, craft legendary pieces, commission Supreme Regalia, and tend Dynasty Heirlooms. Requires Royal Court for artifact actions."
 er_manage_reliquary_decision_tooltip:0 "Open the Exalted Reliquary manage hub"
 er_manage_reliquary_decision_confirm:0 "Open Hub"
 er_manage_reliquary_decision_effect_tt:0 "Opens the Exalted Reliquary manage hub"

 # Decision group
 decision_group_type_er_reliquary:0 "Exalted Reliquary"

 # Artifact names / descs
 er_reliquary_weapon_name:0 "Exalted Reliquary Blade"
 er_reliquary_weapon_desc:0 "A legendary blade forged for the Exalted Reliquary — keen steel meant for a ruler's chosen champions."
 er_reliquary_armor_name:0 "Exalted Reliquary Panoply"
 er_reliquary_armor_desc:0 "Illustrious plate from the Reliquary vault, worked to turn blades and steady nerves in the press of war."
 er_reliquary_trinket_name:0 "Exalted Reliquary Jewel"
 er_reliquary_trinket_desc:0 "A court jewel of the Reliquary — soft power set in gold, worn where every envoy can see it."
 er_reliquary_helmet_name:0 "Exalted Reliquary Circlet"
 er_reliquary_helmet_desc:0 "A circlet from the Reliquary, catching light like a lesser crown and reminding the hall who rules."
 er_reliquary_pedestal_name:0 "Exalted Reliquary Relic"
 er_reliquary_pedestal_desc:0 "A staged relic of the Exalted Reliquary, displayed to feed court grandeur and dynasty pride."
 er_supreme_regalia_crown_name:0 "Supreme Regalia Crown"
 er_supreme_regalia_crown_desc:0 "The crown of the Supreme Regalia — its majesty scales with the wearer's highest title, and the line is meant to wear it still."
 er_heirloom_restored_name:0 "Restored House Heirloom"
 er_heirloom_restored_desc:0 "The house has restored its heirloom. The object endures even when holders fall, so the lineage keeps its mythic claim."

