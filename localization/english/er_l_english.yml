 # Settings hub
 er_settings.1001.t:0 "Exalted Reliquary"
 er_settings.1001.desc_intro:0 "Your Reliquary board: economy mode, Royal Court status, and module actions."
 er_settings.1001.desc_blank:0 "\n"
 er_settings.1001.desc_modules:0 "Modules: Reliquary Core, Supreme Regalia, and Dynasty Heirlooms answer to their game rules. Toggle them under Game Rules → Tweaks."
 er_settings.1001.desc_footer:0 "Craft, upgrade, repair, awaken, vault, regalia, and heirlooms open from the options below — not as a clutter of top-level decisions."
 er_settings.economy.free:0 "Economy: #high Free#! (no gold sink)"
 er_settings.economy.modest:0 "Economy: Paid — Modest (×1)"
 er_settings.economy.expensive:0 "Economy: #high Paid — Expensive#! (×3)"
 er_settings.economy.ruinous:0 "Economy: #high Paid — Ruinous#! (×8)"
 er_settings.dlc.yes:0 "Royal Court: available — artifact verbs unlocked."
 er_settings.dlc.no:0 "Royal Court: #high missing#! — artifact verbs hidden. The hub still opens."
 er_settings.opt.economy_free:0 "Economy: Free — cycle"
 er_settings.opt.economy_modest:0 "Economy: Modest — cycle"
