 # Action menus
 er_actions.1001.t:0 "Reliquary Actions"
 er_actions.1001.desc:0 "Tend your Exalted Reliquary: craft new pieces, upgrade and repair what you hold, awaken a limited few, or stage vault grandeur."
 er_actions.1010.t:0 "Craft Reliquary Piece"
 er_actions.1010.desc:0 "Choose what to forge for the Reliquary. Costs follow the live economy mode."
 er_actions.1101.t:0 "Supreme Regalia"
 er_actions.1101.desc:0 "Commission the title-scaling crown for your house, or refresh its band after a rank change."
 er_actions.1201.t:0 "Dynasty Heirlooms"
 er_actions.1201.desc:0 "Bind a Reliquary piece to your house, or reclaim one held by an outsider. Never-lost restores vanished heirlooms for the house head."
 er_actions.opt.craft:0 "Craft Reliquary Piece…"
 er_actions.opt.upgrade:0 "Upgrade Reliquary Piece"
 er_actions.opt.repair:0 "Repair Reliquary Piece"
 er_actions.opt.awaken:0 "Awaken Reliquary Piece"
 er_actions.opt.vault:0 "Stage Vault Grandeur"
 er_actions.opt.craft_weapon:0 "Craft Blade"
 er_actions.opt.craft_armor:0 "Craft Panoply"
 er_actions.opt.craft_trinket:0 "Craft Jewel"
 er_actions.opt.craft_helmet:0 "Craft Circlet"
 er_actions.opt.craft_pedestal:0 "Craft Display Relic"
 er_actions.opt.commission_regalia:0 "Commission Supreme Regalia"
 er_actions.opt.refresh_regalia:0 "Refresh Regalia Scaling"
 er_actions.opt.bind_heirloom:0 "Bind / Craft House Heirloom"
 er_actions.opt.reclaim_heirloom:0 "Reclaim House Heirloom"
 er_actions.opt.back:0 "Back"
 er_actions.tt.craft:0 "Open the craft type menu"
 er_actions.tt.craft_cost:0 "Pays the craft Reliquary cost for the current economy mode, then creates the piece"
 er_actions.tt.upgrade:0 "Pays upgrade cost and refines one owned Exalted Reliquary artifact"
 er_actions.tt.repair:0 "Pays repair cost and restores durability on a damaged Exalted Reliquary artifact"
 er_actions.tt.awaken:0 "Pays awaken cost and applies a mythic modifier (cap enforced)"
 er_actions.tt.vault:0 "Pays vault cost and applies lasting court grandeur pomp"
 er_actions.tt.commission_regalia:0 "Pays regalia craft cost and creates the title-scaling crown"
 er_actions.tt.refresh_regalia:0 "Pays refresh cost and re-applies the title band"
 er_actions.tt.bind_heirloom:0 "Pays heirloom cost; binds an owned piece or crafts a new house heirloom"
 er_actions.tt.reclaim_heirloom:0 "Pays reclaim cost and transfers a missing house heirloom to you"

 # Notify events
 er_events.1001.t:0 "Reliquary Crafted"
 er_events.1001.desc:0 "A new piece joins the Exalted Reliquary."
 er_events.1002.t:0 "Reliquary Upgraded"
 er_events.1002.desc:0 "Artisans refine an Exalted Reliquary piece to a higher grade."
 er_events.1003.t:0 "Reliquary Repaired"
 er_events.1003.desc:0 "Wear is worked out of an Exalted Reliquary piece."
 er_events.1004.t:0 "Reliquary Awakened"
 er_events.1004.desc:0 "A Reliquary piece awakens into mythic potency — still a court treasure, not a living demigod."
 er_events.1005.t:0 "Vault Grandeur"
 er_events.1005.desc:0 "The Reliquary vault is staged. Court grandeur and prestige pomp rise while the vault stands."
 er_events.1101.t:0 "Supreme Regalia Commissioned"
 er_events.1101.desc:0 "The Supreme Regalia crown is forged. Its power will scale with your highest title, and heirs may auto-equip it on succession."
 er_events.1102.t:0 "Regalia Refreshed"
 er_events.1102.desc:0 "The Supreme Regalia band is refreshed to match your current rank."
 er_events.1201.t:0 "Heirloom Bound"
 er_events.1201.desc:0 "A piece is bound to the house as a Dynasty Heirloom."
 er_events.1202.t:0 "Heirloom Reclaimed"
 er_events.1202.desc:0 "The house head reclaims a Dynasty Heirloom from outside hands."
 er_events.1203.t:0 "Heirloom Restored"
 er_events.1203.desc:0 "The house restores a lost Dynasty Heirloom so the lineage keeps its mythic object."
 er_events.2001.t:0 "Supreme Regalia Equipped"
 er_events.2001.desc:0 "Succession settles. The Supreme Regalia finds its place on your brow."
 er_events.9001.t:0 "Exalted Reliquary Needs Royal Court"
 er_events.9001.desc:0 "Exalted Reliquary is loaded, but Royal Court is not. Artifact craft, regalia, and heirloom verbs stay hidden until that DLC is available. The manage hub still opens for status."
 er_events.opt.ok:0 "Very well"

 # Game rules
 rule_er_rule_economy:0 "Exalted Reliquary: Economy"
 setting_er_rule_economy_free:0 "#high Free#!"
 setting_er_rule_economy_free_desc:0 "Craft, upgrade, repair, awaken, vault, reclaim, and regalia refresh charge no gold. Validity checks still apply."
 setting_er_rule_economy_paid_modest:0 "Paid — Modest"
 setting_er_rule_economy_paid_modest_desc:0 "Gold costs use the base table (×1). Noticeable but comfortable."
 setting_er_rule_economy_paid_expensive:0 "Paid — Expensive"
 setting_er_rule_economy_paid_expensive_desc:0 "Gold costs ×3. A real sink for banked treasuries. Default for this pack."
 setting_er_rule_economy_paid_ruinous:0 "#high Paid — Ruinous#!"
 setting_er_rule_economy_paid_ruinous_desc:0 "Gold costs ×8. End-game drain / challenge mode."

 rule_er_rule_ai_economy:0 "Exalted Reliquary: AI Economy"
 setting_er_rule_ai_economy_follow_player_rule:0 "Follow Player Rule"
 setting_er_rule_ai_economy_follow_player_rule_desc:0 "AI pays the same economy mode as the live player cfg / campaign rule."
 setting_er_rule_ai_economy_ai_always_free:0 "AI Always Free"
 setting_er_rule_ai_economy_ai_always_free_desc:0 "AI pays no gold for Reliquary verbs (default — prevents AI treasury wipe)."
 setting_er_rule_ai_economy_ai_disabled:0 "AI Disabled"
 setting_er_rule_ai_economy_ai_disabled_desc:0 "AI may not use Exalted Reliquary verbs."

 rule_er_rule_hub_economy_cycle:0 "Exalted Reliquary: Hub Economy Cycle"
 setting_er_rule_hub_economy_cycle_allow:0 "Allow"
 setting_er_rule_hub_economy_cycle_allow_desc:0 "The manage hub may cycle economy mode mid-campaign."
 setting_er_rule_hub_economy_cycle_lock_to_game_rule:0 "Lock to Game Rule"
 setting_er_rule_hub_economy_cycle_lock_to_game_rule_desc:0 "Hub cannot change economy mode after start; campaign rule stands."

 rule_er_rule_module_reliquary:0 "Exalted Reliquary: Reliquary Core Module"
 setting_er_rule_module_reliquary_on:0 "On"
 setting_er_rule_module_reliquary_on_desc:0 "Craft, upgrade, repair, awaken, and vault grandeur are available."
 setting_er_rule_module_reliquary_off:0 "Off"
 setting_er_rule_module_reliquary_off_desc:0 "Reliquary Core actions are hidden."

 rule_er_rule_module_regalia:0 "Exalted Reliquary: Supreme Regalia Module"
 setting_er_rule_module_regalia_on:0 "On"
 setting_er_rule_module_regalia_on_desc:0 "Supreme Regalia commission, refresh, and auto-equip are available."
 setting_er_rule_module_regalia_off:0 "Off"
 setting_er_rule_module_regalia_off_desc:0 "Supreme Regalia actions are hidden."

 rule_er_rule_module_heirlooms:0 "Exalted Reliquary: Dynasty Heirlooms Module"
 setting_er_rule_module_heirlooms_on:0 "On"
 setting_er_rule_module_heirlooms_on_desc:0 "Bind, reclaim, and never-lost heirloom tools are available."
 setting_er_rule_module_heirlooms_off:0 "Off"
 setting_er_rule_module_heirlooms_off_desc:0 "Dynasty Heirloom actions are hidden."

 rule_er_rule_granting:0 "Exalted Reliquary: Who May Use"
 setting_er_rule_granting_player_only:0 "Player Only"
 setting_er_rule_granting_player_only_desc:0 "Only human players may use Reliquary verbs."
 setting_er_rule_granting_player_and_ai:0 "#high Player and AI#!"
 setting_er_rule_granting_player_and_ai_desc:0 "Players and AI may use Reliquary verbs (AI still obeys AI Economy)."
 setting_er_rule_granting_disabled:0 "Disabled"
 setting_er_rule_granting_disabled_desc:0 "Reliquary verbs are disabled. Existing artifacts remain."

 rule_er_rule_regalia_auto_equip:0 "Exalted Reliquary: Regalia Auto-Equip"
 setting_er_rule_regalia_auto_equip_on:0 "On"
 setting_er_rule_regalia_auto_equip_on_desc:0 "On player succession, the heir auto-equips the Supreme Regalia after a short delay."
 setting_er_rule_regalia_auto_equip_off:0 "Off"
 setting_er_rule_regalia_auto_equip_off_desc:0 "No automatic succession equip."

 rule_er_rule_heirloom_never_lost:0 "Exalted Reliquary: Heirlooms Never Lost"
 setting_er_rule_heirloom_never_lost_on:0 "On"
 setting_er_rule_heirloom_never_lost_on_desc:0 "If all house heirlooms vanish, the house head may restore one (economy still applies)."
 setting_er_rule_heirloom_never_lost_off:0 "Off"
 setting_er_rule_heirloom_never_lost_off_desc:0 "No automatic restore scan."

 rule_er_rule_vault_grandeur:0 "Exalted Reliquary: Vault Grandeur"
 setting_er_rule_vault_grandeur_on:0 "On"
 setting_er_rule_vault_grandeur_on_desc:0 "Vault grandeur ritual is available."
 setting_er_rule_vault_grandeur_off:0 "Off"
 setting_er_rule_vault_grandeur_off_desc:0 "Vault grandeur ritual is hidden."

 rule_er_rule_max_awakened:0 "Exalted Reliquary: Max Awakened"
 setting_er_rule_max_awakened_1:0 "1"
 setting_er_rule_max_awakened_1_desc:0 "At most one awakened personal Reliquary artifact."
 setting_er_rule_max_awakened_3:0 "3"
 setting_er_rule_max_awakened_3_desc:0 "Up to three awakened Reliquary artifacts (default)."
 setting_er_rule_max_awakened_5:0 "5"
 setting_er_rule_max_awakened_5_desc:0 "Up to five awakened Reliquary artifacts."
 setting_er_rule_max_awakened_unlimited:0 "#high Unlimited#!"
 setting_er_rule_max_awakened_unlimited_desc:0 "No cap on concurrent awakened Reliquary artifacts."

 rule_er_rule_decaying:0 "Exalted Reliquary: Artifact Decay"
 setting_er_rule_decaying_normal:0 "Normal"
 setting_er_rule_decaying_normal_desc:0 "ER artifacts use normal durability decay."
 setting_er_rule_decaying_never_decay:0 "Never Decay"
 setting_er_rule_decaying_never_decay_desc:0 "ER-flagged artifacts are created non-decaying (fantasy permanence)."